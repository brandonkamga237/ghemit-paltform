name: gehmit

# ── Déploiement production derrière Traefik ─────────────────────────────────
# Réseau externe partagé : traefik-public (voir /root/traefik/docker-compose.yml)
# Domaines :
#   gehmit.org + www.gehmit.org  → frontend public
#   admin.gehmit.org             → back office
#   api.gehmit.org               → backend (/api)
#   auth.gehmit.org              → Keycloak

services:
  postgres:
    image: postgres:16-alpine
    container_name: gehmit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-platform}
      POSTGRES_USER: ${DB_USER:-platform}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - gehmit-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-platform} -d ${DB_NAME:-platform}"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: quay.io/minio/minio:latest
    container_name: gehmit-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER requis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requis}
    volumes:
      - minio-data:/data
    networks:
      - gehmit-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: gehmit-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --proxy-headers=xforwarded
      - --http-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD requis}
      KC_HOSTNAME: https://auth.gehmit.org
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-platform}
      KC_DB_USERNAME: ${DB_USER:-platform}
      KC_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
    volumes:
      - ./keycloak/realm-gehmit.json:/opt/keycloak/data/import/realm-gehmit.json:ro
    networks:
      - gehmit-internal
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      # HTTP → HTTPS
      - traefik.http.routers.gehmit-kc-http.rule=Host(`auth.gehmit.org`)
      - traefik.http.routers.gehmit-kc-http.entrypoints=web
      - traefik.http.routers.gehmit-kc-http.middlewares=gehmit-https-redirect
      # HTTPS
      - traefik.http.routers.gehmit-kc.rule=Host(`auth.gehmit.org`)
      - traefik.http.routers.gehmit-kc.entrypoints=websecure
      - traefik.http.routers.gehmit-kc.tls.certresolver=le
      - traefik.http.routers.gehmit-kc.priority=10
      - traefik.http.services.gehmit-kc.loadbalancer.server.port=8080

  backend:
    build: ./platform-backend/platform
    container_name: gehmit-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-platform}
      DB_USER: ${DB_USER:-platform}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/gehmit/protocol/openid-connect/certs
      CORS_ORIGINS: https://gehmit.org,https://www.gehmit.org,https://admin.gehmit.org
      SEED_CONTENT: ${SEED_CONTENT:-true}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER requis}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requis}
      MINIO_BUCKET: gehmit-media
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST requis}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME requis}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD requis}
      MAIL_AUTH: "true"
      MAIL_STARTTLS: "true"
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM requis}
      API_PUBLIC_URL: https://api.gehmit.org
      PUBLIC_SITE_URL: https://gehmit.org
      NEWSLETTER_TOKEN_SECRET: ${NEWSLETTER_TOKEN_SECRET:?NEWSLETTER_TOKEN_SECRET requis}
    networks:
      - gehmit-internal
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.gehmit-api-http.rule=Host(`api.gehmit.org`)
      - traefik.http.routers.gehmit-api-http.entrypoints=web
      - traefik.http.routers.gehmit-api-http.middlewares=gehmit-https-redirect
      - traefik.http.routers.gehmit-api.rule=Host(`api.gehmit.org`)
      - traefik.http.routers.gehmit-api.entrypoints=websecure
      - traefik.http.routers.gehmit-api.tls.certresolver=le
      - traefik.http.routers.gehmit-api.priority=1
      - traefik.http.services.gehmit-api.loadbalancer.server.port=8080
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_started

  web-public:
    build:
      context: ./plaform-frontend
      args:
        VITE_API_URL: https://api.gehmit.org
    container_name: gehmit-frontend-public
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.gehmit-public-http.rule=Host(`gehmit.org`) || Host(`www.gehmit.org`)
      - traefik.http.routers.gehmit-public-http.entrypoints=web
      - traefik.http.routers.gehmit-public-http.middlewares=gehmit-https-redirect
      - traefik.http.routers.gehmit-public.rule=Host(`gehmit.org`) || Host(`www.gehmit.org`)
      - traefik.http.routers.gehmit-public.entrypoints=websecure
      - traefik.http.routers.gehmit-public.tls.certresolver=le
      - traefik.http.services.gehmit-public.loadbalancer.server.port=80
      - traefik.http.middlewares.gehmit-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.gehmit-https-redirect.redirectscheme.permanent=true

  web-admin:
    build:
      context: "plaform-frontend - admin"
      args:
        VITE_API_URL: https://api.gehmit.org
        VITE_KEYCLOAK_URL: https://auth.gehmit.org
        VITE_KEYCLOAK_REALM: gehmit
        VITE_KEYCLOAK_CLIENT: admin-frontend
    container_name: gehmit-frontend-admin
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.gehmit-admin-http.rule=Host(`admin.gehmit.org`)
      - traefik.http.routers.gehmit-admin-http.entrypoints=web
      - traefik.http.routers.gehmit-admin-http.middlewares=gehmit-https-redirect
      - traefik.http.routers.gehmit-admin.rule=Host(`admin.gehmit.org`)
      - traefik.http.routers.gehmit-admin.entrypoints=websecure
      - traefik.http.routers.gehmit-admin.tls.certresolver=le
      - traefik.http.services.gehmit-admin.loadbalancer.server.port=80

networks:
  gehmit-internal:
  traefik-public:
    external: true

volumes:
  postgres-data:
  minio-data:
