spring.application.name=platform
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/platform}
spring.datasource.username=${DB_USER:platform}
spring.datasource.password=${DB_PASSWORD:platform}
spring.jpa.hibernate.ddl-auto=update

# Keycloak : jwk-set-uri est résolu paresseusement (le backend démarre même si Keycloak n'est pas prêt)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8180/realms/gehmit/protocol/openid-connect/certs}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
app.content.seed=${SEED_CONTENT:true}

# MinIO (stockage des médias)
app.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
app.minio.bucket=${MINIO_BUCKET:gehmit-media}

# Mailhog (SMTP de dev pour la newsletter)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
app.mail.from=${MAIL_FROM:newsletter@gehmit.org}
