spring.application.name=platform
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/platform}
spring.datasource.username=${DB_USER:platform}
spring.datasource.password=${DB_PASSWORD:platform}
spring.jpa.hibernate.ddl-auto=update

# Keycloak : jwk-set-uri est résolu paresseusement (le backend démarre même si Keycloak n'est pas prêt)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8180/realms/gehmit/protocol/openid-connect/certs}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
app.content.seed=${SEED_CONTENT:true}

# Uploads (médiathèque, CV) : les photos de smartphone dépassent le défaut de 1 Mo
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:30MB}

# MinIO (stockage des médias)
app.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
app.minio.bucket=${MINIO_BUCKET:gehmit-media}

# SMTP (Mailhog en dev, Spacemail en prod)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:newsletter@gehmit.org}

# URLs publiques (lien de désinscription dans les e-mails, redirection après clic)
app.api.public-url=${API_PUBLIC_URL:http://localhost:8080}
app.site.public-url=${PUBLIC_SITE_URL:http://localhost:5173}
# Secret de signature des jetons de désinscription
app.newsletter.token-secret=${NEWSLETTER_TOKEN_SECRET:dev-only-change-me}
